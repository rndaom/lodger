name: Feature request
description: Suggest something lodger should do.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The situation you're in, before any solution. What do you do today instead?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like lodger to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Anything else you considered
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'm willing to try writing this (see CONTRIBUTING.md)
        - label: I can test it on my hardware
