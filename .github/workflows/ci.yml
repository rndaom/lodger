name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install . ruff
      - name: Lint
        run: ruff check .
      - name: Test (no GPU needed)
        run: python -m unittest discover tests
      - name: The installed package runs from another folder (no GPU, no checkout on the path)
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install .
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/lodger" --help
          "$RUNNER_TEMP/venv/bin/lodger" doctor
          "$RUNNER_TEMP/venv/bin/python" -m lodger.cli --help
          "$RUNNER_TEMP/venv/bin/lodger" setup --help
