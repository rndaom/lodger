name: Release

# Pushing a tag like v0.2.0 builds the source release and wheel, checks them, attaches them to a GitHub release,
# and publishes them on PyPI. PyPI needs a "trusted publisher" for this repository once (pypi.org, project
# lodger, Publishing: owner rndaom, repository lodger, workflow release.yml, environment pypi); no token is stored.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: The tag is the package's version
        run: |
          v=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' lodger/__init__.py)
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME but lodger/__init__.py says $v"; exit 1; }
          grep -q "^## \[$v\]" CHANGELOG.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
      - name: Test
        run: python -m pip install . && python -m unittest discover tests
      - name: Build
        run: python -m pip install build twine && python -m build && twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  github:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: GitHub release with the files
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "lodger ${GITHUB_REF_NAME#v}" --notes "See CHANGELOG.md."

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
