# lodger's models: every .gguf file in these folders is served (one at a time) at http://127.0.0.1:8181/v1,
# and pi lists them all. A [models.NAME] section names a file and gives it settings; files without one
# get a name from their file name. Settings are llama-server options (temp = 0.7 -> --temp 0.7).
# After editing: systemctl --user restart lodger
# (This example is the one used on the PC lodger was built on; the live copy is ~/.config/lodger/models.toml.)

folders = ["~/models", "~/LocalAI/llama/models", "~/.cache/omarchy/local-ai/models"]
# files in those folders that aren't models to serve on their own
ignore = ["*Engram*", "*mmproj*", "*/maya-ds4/*", "*/stripes/*"]
default = "qwen3.6-35b"

# Used by every model unless its own section says otherwise. q8_0 KV cache halves the context's memory
# (more context, or more of the model on the graphics card) for a quality loss too small to measure.
[defaults]
flash-attn = "on"
cache-type-k = "q8_0"
cache-type-v = "q8_0"
no-warmup = true

[models."qwen3.6-35b"]
file = "~/models/qwen3.6-35b-a3b/Qwen3.6-35B-A3B-UD-IQ4_XS.gguf"
reasoning = "off"
temp = 0.7
top-p = 0.8
top-k = 20
min-p = 0
presence-penalty = 1.5

# Qwen card sampling for non-thinking mode (from the old router presets).
[models."qwen3.5-9b"]
file = "~/LocalAI/llama/models/Qwen3.5-9B/Qwen3.5-9B-UD-Q4_K_XL.gguf"
